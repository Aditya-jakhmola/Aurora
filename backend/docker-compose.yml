services:
  postgres:
    image: postgres:17-alpine
    container_name: aurora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora_dev_password
      POSTGRES_DB: aurora

    ports:
      - "5433:5432"

    volumes:
      - aurora_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurora_postgres_data: